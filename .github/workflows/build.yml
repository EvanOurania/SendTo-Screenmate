name: Build

# Every push and pull request: unit tests and lint.
# Every tag starting with "v" (e.g. v1.2.0): also signed release APKs, published as a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # Needed to create the GitHub release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          # Keeps Gradle's downloads between builds. (gradle/actions does this too, but since v6 its
          # caching comes with Gradle's commercial terms of use.)
          cache: gradle

      - name: Unit tests and lint
        run: ./gradlew testDebugUnitTest lintDebug

      - name: Decode the signing keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "::error::The SIGNING_* secrets are missing: see 'Releasing' in README.md"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APKs
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          mkdir -p dist
          cp receiver/build/outputs/apk/release/receiver-release.apk "dist/ScreenMate-Receiver-$GITHUB_REF_NAME.apk"
          cp sender/build/outputs/apk/release/sender-release.apk "dist/SendTo-ScreenMate-$GITHUB_REF_NAME.apk"

      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          generate_release_notes: true
